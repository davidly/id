name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      # Find the installed Visual Studio with vswhere, so the build doesn't depend on its edition or path.
      - name: build id.exe and imgenai.exe
        shell: cmd
        run: |
          set "VSINSTALL="
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > "%TEMP%\vsinstall.txt" || exit /b 1
          set /p VSINSTALL=<"%TEMP%\vsinstall.txt"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call .\m.bat || exit /b 1
          cl /nologo /D IMGENAI_ONLY id.cxx /I.\ /O2i /EHac /Zi /Gy /Fo:imgenai.obj /Fd:imgenai-vc.pdb /Fe:imgenai.exe /link /incremental:no /OPT:REF /PDB:imgenai.pdb || exit /b 1
          if not exist id.exe exit /b 1
          if not exist imgenai.exe exit /b 1

      - name: archive the binaries
        uses: actions/upload-artifact@v7
        with:
          name: application
          path: |
            id.exe
            imgenai.exe
